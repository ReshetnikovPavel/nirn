[package]
name = "nirn"
version = "0.1.0"
edition = "2024"

[dependencies]
async-io = "2"
chrono = "0.4.44"
iced = { version = "0.14.0", features = ["smol"] }
iced_layershell = "0.18.1"
inotify = { version = "0.11.5", default-features = false }
libpulse-binding = { version = "2.30.1", features = ["pa_v14"] }
niri-ipc = "=26.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
zbus = "5.15.0"
